<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f5f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=6">
<title>TEP 2026 • Margot</title>
</head>
<body>
<header><div><small>TRILHA TEÓRICA EM ÁUDIO</small><h1>TEP 2026</h1><p>Margot • raciocínio de prova e revisão clínica</p></div><span class="badge">SBP</span></header>
<main>
<section id="resume" class="resume hidden"><small>CONTINUAR OUVINDO</small><strong id="resumeTitle"></strong><button id="resumeBtn">Continuar</button></section>
<div class="section-title"><h2>Trilha de estudo</h2><span id="count"></span></div>
<div id="library"></div>
</main>
<div id="player" class="player hidden">
<div class="now"><div><small id="nowSpecialty"></small><strong id="nowTitle"></strong></div><button id="closePlayer" aria-label="Fechar">×</button></div>
<div class="times"><span id="current">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div>
<div class="controls"><button id="prev" aria-label="Anterior">‹</button><button id="back" aria-label="Voltar 15 segundos">−15</button><button id="play" class="play" aria-label="Reproduzir">▶</button><button id="forward" aria-label="Avançar 15 segundos">+15</button><button id="next" aria-label="Próxima">›</button></div>
<div class="speed"><button data-speed="1">1×</button><button data-speed="1.25">1,25×</button><button data-speed="1.5">1,5×</button><button data-speed="2">2×</button></div>
<audio id="audio" preload="metadata"></audio>
</div>
<script src="app.js?v=6"></script>
</body></html>
